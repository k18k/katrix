name: Release

# With changesets on main, opens (or updates) the "Version Packages" pull request that bumps the
# versions and writes the CHANGELOG.md files. Merging that pull request releases @katrix/server and
# @katrix/client on GitHub (one version for both: a "fixed" group in .changeset/config.json):
# scripts/release-github.ts pushes each built package to its branch of this repository ("server",
# "client") with a tag per version ("server-X.Y.Z"), which is what `npm install github:k18k/katrix#server`
# installs. The action then tags the source commit (@katrix/server@X.Y.Z, @katrix/client@X.Y.Z) and
# creates the GitHub releases. Nothing goes to a package registry, so no registry token is involved:
# the workflow's own GITHUB_TOKEN (contents: write) pushes the branches and tags.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          # No dependency cache in this privileged job: a poisoned cache could reach the published package.
      - run: npm ci
      # Security (https://github.com/k18k/katrix/issues/15): third-party action pinned to a commit, not a movable tag,
      # because this job can publish the packages. Dependabot updates the pin.
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          pr-title: Release
          commit-message: Release
