name: Release

# With changesets on main, opens (or updates) the "Version Packages" pull request that bumps the
# versions and writes the CHANGELOG.md files. Merging that pull request publishes @katrix/server and
# @katrix/client to npm (one version for both: a "fixed" group in .changeset/config.json), tags the
# release per package (@katrix/server@X.Y.Z, @katrix/client@X.Y.Z) and creates the GitHub releases. Publishing uses npm trusted publishing (OIDC):
# no npm token is stored; npmjs.com trusts this workflow, which also adds provenance.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          # No dependency cache in this privileged job: a poisoned cache could reach the published package.
      - run: npm ci
      # Security (https://github.com/k18k/katrix/issues/15): third-party action pinned to a commit, not a movable tag,
      # because this job can publish the packages. Dependabot updates the pin.
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          pr-title: Release
          commit-message: Release
