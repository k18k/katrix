name: Load test

# Runs the load test (packages/core/loadtest/) on a GitHub runner and publishes its results as README badges.
# Investigation and tuning runs happen locally; this one exists to show where main stands. The
# numbers describe one GitHub runner (4 CPUs, 16 GB), with the load generator on the same machine.
# Clusters run with two nodes here: five nodes, Postgres and k6 on four CPUs measured how they
# compete for the CPUs (the nodes sat idle at under 30 req/s each), not the homeserver. Five
# nodes are measured locally (README).
on:
  push:
    branches: [main]
    paths: ["packages/core/src/**", "packages/core/loadtest/**", "package-lock.json", ".github/workflows/loadtest.yml"]
  workflow_dispatch:
    inputs:
      force_threshold_failure:
        description: Set an impossible send threshold, to check that crossed thresholds fail the run
        type: boolean
        default: false

permissions:
  contents: read

# A newer push makes a running load test pointless.
concurrency:
  group: loadtest-${{ github.ref }}
  cancel-in-progress: true

env:
  ONLINE_USERS: 1000
  MESSAGES_PER_SECOND: 50
  ROOMS: 25
  RAMP: 30s
  DURATION: 30s
  # https://github.com/k18k/matrix-nodejs-homeserver/issues/62: k6's exit codes used to be swallowed, so a run
  # that crossed its thresholds still passed. Each scenario's exit code is kept next to its summary (the badges
  # show it), and the last step fails the run when any scenario did not pass.
  SEND_P95_MS: ${{ inputs.force_threshold_failure && '1' || '1000' }}

jobs:
  run:
    name: Run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
        working-directory: .

      - name: SQLite, one process
        run: |
          # k6 runs as its own user in its container: it has to be able to write the summaries.
          mkdir -p loadtest/results "$RUNNER_TEMP/lt" && chmod 777 loadtest/results
          DATA_DIR="$RUNNER_TEMP/lt" node loadtest/server.ts > loadtest/results/sqlite-server.log 2>&1 &
          server=$!
          for i in $(seq 60); do curl -sf http://localhost:8008/_matrix/client/versions >/dev/null && break; sleep 1; done
          docker run --rm --network host -v "$PWD/loadtest/k6:/scripts:ro" -v "$PWD/loadtest/results:/results" \
            -e BASE_URL=http://localhost:8008 -e ONLINE_USERS -e MESSAGES_PER_SECOND -e ROOMS -e RAMP -e DURATION -e SEND_P95_MS \
            grafana/k6:2.3.0 run --summary-export=/results/sqlite.json /scripts/matrix.js && code=0 || code=$?
          echo "$code" > loadtest/results/sqlite.exit
          kill "$server"

      - name: Postgres scenarios
        run: |
          compose="docker compose -p matrix-loadtest -f loadtest/docker-compose.yml"
          $compose build
          for scenario in "pg-nocluster 0 1" "pg-cluster-1 1 1" "pg-cluster-2 1 2"; do
            set -- $scenario
            SUMMARY=$1 CLUSTER=$2 $compose up --scale "homeserver=$3" --abort-on-container-exit --exit-code-from k6 k6 \
              && code=0 || code=$?
            echo "$code" > "loadtest/results/$1.exit"
            $compose logs homeserver --no-log-prefix | grep "req/s" > "loadtest/results/$1-server.log" || true
            $compose down -v
          done

      - name: Badges
        run: |
          node loadtest/badges.ts loadtest/results/badges \
            "sqlite=load · SQLite=loadtest/results/sqlite.json" \
            "pg-nocluster=load · Postgres=loadtest/results/pg-nocluster.json" \
            "pg-cluster-1=load · Postgres cluster ×1=loadtest/results/pg-cluster-1.json" \
            "pg-cluster-2=load · Postgres cluster ×2=loadtest/results/pg-cluster-2.json" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: loadtest-results
          path: packages/core/loadtest/results/

      # After the upload, so the badges are published either way.
      - name: Thresholds
        run: |
          failed=0
          for f in loadtest/results/*.exit; do
            code=$(cat "$f"); name=$(basename "$f" .exit)
            case "$code" in
              0) ;;
              99) echo "::error::$name: k6 thresholds crossed"; failed=1 ;;
              *) echo "::error::$name: the run failed (k6 exit $code)"; failed=1 ;;
            esac
          done
          exit "$failed"

  # Commits the badge data to the loadtest-results branch, which the README badges read. Only this
  # job may write to the repository, and it runs no code from the checkout.
  publish:
    name: Publish badges
    needs: run
    # Also when thresholds were crossed: the badges say so.
    if: always() && github.ref == 'refs/heads/main' && needs.run.result != 'cancelled' && !inputs.force_threshold_failure
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: loadtest-results
          path: ${{ runner.temp }}/results
      - name: Commit to loadtest-results
        env:
          RESULTS: ${{ runner.temp }}/results
          SHA: ${{ github.sha }}
        run: |
          if git fetch --depth 1 origin loadtest-results; then
            git checkout -B loadtest-results FETCH_HEAD
          else
            # A new branch with no history and no files from main.
            git switch --orphan loadtest-results
          fi
          rm -rf badges results
          mkdir -p badges results
          cp "$RESULTS"/badges/*.json badges/
          cp "$RESULTS"/*.json results/ 2>/dev/null || true
          printf 'Load test results for %s: %s online users, %s messages/s, %s rooms, %s ramp + %s.\n' \
            "$SHA" "$ONLINE_USERS" "$MESSAGES_PER_SECOND" "$ROOMS" "$RAMP" "$DURATION" > README.md
          git add -A badges results README.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Load test results for $SHA" || exit 0
          git push origin loadtest-results
