name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Security (https://github.com/k18k/matrix-nodejs-homeserver/issues/7): the jobs run pull request code, so the token may only read the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request makes an older run pointless: it tests code that
# is already replaced, and Complement takes a runner for ~15 minutes. Cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: node node_modules/@matrix-org/matrix-sdk-crypto-nodejs/download-lib.js
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # The published package must build (tsdown → dist/, .js and .d.ts per module), and its exports
      # and types must resolve for consumers (publint, arethetypeswrong; the package is ESM only).
      - run: npm pack --dry-run -w matrix-nodejs-homeserver
      - run: npm run check:package -w matrix-nodejs-homeserver

  # The package supports every maintained Node.js LTS; development uses the latest release.
  tests:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    # The storage conformance tests also run against Postgres (#58).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      PG_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      # The apps import the built library (packages/core/dist), which --ignore-scripts skipped.
      - run: npm run build -w matrix-nodejs-homeserver
      # The audit bot's crypto (matrix-sdk-crypto) is a native module that its install script
      # downloads from the project's GitHub releases.
      - run: node node_modules/@matrix-org/matrix-sdk-crypto-nodejs/download-lib.js
      - run: npm test

  # Federation and end-to-end encryption with Synapse (#61): packages/core/interop/.
  interop:
    name: Interop (Synapse)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
        working-directory: .
      - run: node node_modules/@matrix-org/matrix-sdk-crypto-nodejs/download-lib.js
        working-directory: .
      - run: docker compose -p matrix-interop -f interop/docker-compose.yml up -d --build --wait
      - run: node interop/run.ts >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: docker compose -p matrix-interop -f interop/docker-compose.yml logs --tail 200

  complement:
    name: Complement
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # Same script as locally: Complement runs in a Go container (pinned in the script).
      # Failures are judged by the regression check below, not by the exit code.
      - name: Run Complement
        env:
          TIMEOUT: 75m
        run: scripts/complement.sh || echo "Complement exited with $?"

      - name: Summarise results
        if: always()
        run: node complement/summarize.ts complement-results.json complement-passing.txt complement-badge.json >> "$GITHUB_STEP_SUMMARY"

      - name: Check for regressions
        run: |
          missing=$(comm -23 <(sort complement/passing.txt | grep -v '^#' | grep .) <(sort complement-passing.txt))
          if [ -n "$missing" ]; then
            echo "::error::Tests that previously passed now fail:"
            echo "$missing"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: complement-results
          path: |
            packages/core/complement-results.json
            packages/core/complement-passing.txt
            packages/core/complement-badge.json

  # Commits the badge to the complement-results branch, which the README badge reads. Only this
  # job may write to the repository; it runs no code from the checkout, and only for main.
  complement-badge:
    name: Publish Complement badge
    needs: complement
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.complement.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: complement-results
          path: ${{ runner.temp }}/results
      - name: Commit to complement-results
        env:
          RESULTS: ${{ runner.temp }}/results
          SHA: ${{ github.sha }}
        run: |
          if git fetch --depth 1 origin complement-results; then
            git checkout -B complement-results FETCH_HEAD
          else
            git switch --orphan complement-results
          fi
          mkdir -p badges
          cp "$RESULTS/complement-badge.json" badges/complement.json
          printf 'Complement results for %s.\n' "$SHA" > README.md
          git add badges README.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Complement results for $SHA" || exit 0
          git push origin complement-results
