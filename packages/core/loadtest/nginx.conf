# Spreads requests over every homeserver container (`docker compose up --scale homeserver=N`).
# Docker's DNS returns all of them for the service name; the resolver re-reads it so scaled-up
# containers are picked up.
events {
  worker_connections 65535;
}
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream homeserver {
    zone homeserver 64k;
    server homeserver:8008 resolve;
    keepalive 512;
  }
  server {
    listen 8008;
    client_max_body_size 50m;
    location / {
      proxy_pass http://homeserver;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      # Long-polling /sync waits up to 30 s.
      proxy_read_timeout 90s;
      proxy_buffering off;
    }
  }
}
