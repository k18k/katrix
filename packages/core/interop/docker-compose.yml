# Interoperability with Synapse (https://github.com/k18k/matrix-nodejs-homeserver/issues/61): this server
# (ours.test, the Complement image) and Synapse (synapse.test) federate both ways, with certificates
# from a throwaway CA. `node interop/run.ts` drives the scenarios through both servers' client APIs.
#
#   docker compose -p matrix-interop -f interop/docker-compose.yml up -d --build --wait
#   node interop/run.ts
#   docker compose -p matrix-interop -f interop/docker-compose.yml down -v
services:
  ca:
    image: alpine:3.22
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        [ -f /ca/ca.crt ] && exit 0
        apk add -q openssl
        openssl req -x509 -newkey rsa:2048 -nodes -keyout /ca/ca.key -out /ca/ca.crt -days 2 -subj "/CN=interop CA" 2>/dev/null
        openssl req -new -newkey rsa:2048 -nodes -keyout /ca/synapse.key -out /tmp/s.csr -subj "/CN=synapse.test" 2>/dev/null
        printf "subjectAltName=DNS:synapse.test\n" > /tmp/ext.cnf
        openssl x509 -req -in /tmp/s.csr -CA /ca/ca.crt -CAkey /ca/ca.key -CAcreateserial -out /ca/synapse.crt -days 2 -extfile /tmp/ext.cnf 2>/dev/null
        chmod 644 /ca/*
    volumes: [ca:/ca]

  ours:
    build: { context: ../../.., dockerfile: packages/core/complement/Dockerfile }
    environment: { SERVER_NAME: ours.test }
    networks: { default: { aliases: [ours.test] } }
    ports: ["18008:8008"]
    # Writable: the entrypoint signs its certificate with this CA (openssl writes a serial file).
    volumes: [ca:/complement/ca]
    depends_on: { ca: { condition: service_completed_successfully } }

  synapse:
    image: matrixdotorg/synapse:v1.163.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - python -m synapse.app.homeserver -c /conf/homeserver.yaml --generate-keys && exec python -m synapse.app.homeserver -c /conf/homeserver.yaml
    networks: { default: { aliases: [synapse.test] } }
    ports: ["28008:8008"]
    volumes: [ca:/ca:ro, ./synapse:/conf:ro, synapse-data:/data]
    depends_on: { ca: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8008/health"]
      interval: 2s
      retries: 60

volumes:
  ca:
  synapse-data:
